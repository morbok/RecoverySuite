    <rect x="715" y="81" width="186" height="78" rx="14" fill="#12263c" stroke="#3b667e"/>
    <text x="808" y="111" fill="#76e2d2" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FIND · REVIEW · RECOVER</text>
    <text x="808" y="138" fill="#c1d2e5" font-size="12" text-anchor="middle">Your drive. Your data.</text>
