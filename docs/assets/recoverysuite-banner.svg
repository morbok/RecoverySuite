<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">RecoverySuite — bring your files back</title>
  <desc id="desc">Windows and Linux disk data recovery. Select a drive, find files, recover to another disk.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1427"/><stop offset="1" stop-color="#142d47"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#61e8d0"/><stop offset="1" stop-color="#6caaff"/></linearGradient>
  </defs>
  <rect width="960" height="240" rx="22" fill="url(#bg)"/>
  <g fill="none" stroke="#35516c" opacity=".5">
    <path d="M660 0v240M720 0v240M780 0v240M840 0v240M900 0v240M600 60h360M600 120h360M600 180h360"/>
  </g>
  <rect x="54" y="51" width="102" height="132" rx="20" fill="#18334c" stroke="#6fa9c9" stroke-width="2"/>
  <circle cx="105" cy="103" r="32" stroke="url(#accent)" stroke-width="6" fill="none"/>
  <circle cx="105" cy="103" r="8" fill="#6ce0d7"/>
  <path d="m105 103 24-19" stroke="#d9f7ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 159h42" stroke="#6c9ab9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="136" cy="159" r="4" fill="#6ce0d7"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="188" y="91" fill="#79dfdc" font-size="12" font-weight="700" letter-spacing="3">WINDOWS + LINUX · OPEN SOURCE</text>
    <text x="184" y="144" fill="#f1f7ff" font-size="47" font-weight="700" letter-spacing="-2">RecoverySuite</text>
