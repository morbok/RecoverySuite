name: Credential safety
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check private files and complete available history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: python3 scripts/check_secrets.py
      - name: Verify rejection and redaction behavior on synthetic repositories
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: python3 -m unittest discover -s tests -p test_secret_guard.py -v
